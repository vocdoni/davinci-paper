<!DOCTYPE html>
<html lang="en" data-color-mode="light" data-light-theme="light" data-dark-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <title>DAVINCI v3-PQ — Post-Quantum Protocol Specification</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css" integrity="sha384-y0W3M22ACdv+yTWx1gSgw8yRa++DRY7bp/LjeFT6Wz8Sawsr//4qb5BDQxsq+xJx" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <style>
    :root {
      color-scheme: light;
      --fgColor-default: #1f2328;
      --fgColor-muted: #57606a;
      --fgColor-accent: #0969da;
      --bgColor-default: #ffffff;
      --bgColor-muted: #f6f8fa;
      --borderColor-default: #d0d7de;
    }
    body {
      margin: 0;
      background: linear-gradient(180deg, #eef2f7 0%, #f6f8fa 30%, #f6f8fa 100%);
      color: #1f2328;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #d0d7de;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
    }
    .topbar > a,
    .topbar > button {
      text-decoration: none;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 6px 10px;
      color: #1f2328;
      background: #f6f8fa;
      font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .topbar > button { cursor: pointer; }
    #toc {
      position: absolute;
      top: 100%;
      left: 16px;
      right: 16px;
      max-width: 600px;
      max-height: 65vh;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(31, 35, 40, 0.15);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    #toc ol { list-style: none; margin: 0; padding: 0; }
    #toc a {
      display: block;
      padding: 5px 8px;
      padding-left: calc(8px + var(--toc-depth) * 16px);
      color: #0969da;
      text-decoration: none;
      border-radius: 4px;
    }
    #toc a:hover, #toc a:focus-visible { background: #f6f8fa; }
    .markdown-body :is(h1, h2, h3, h4, h5, h6) {
      scroll-margin-top: calc(var(--topbar-height, 80px) + 16px);
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 14px auto 24px;
      padding: 30px 28px 40px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(31, 35, 40, 0.07);
      color: #1f2328 !important;
      font-size: 17px;
      line-height: 1.72;
    }
    .markdown-body p,
    .markdown-body li,
    .markdown-body blockquote,
    .markdown-body td,
    .markdown-body th {
      color: #1f2328 !important;
    }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      color: #0f172a !important;
      letter-spacing: -0.01em;
    }
    .markdown-body a {
      color: #0969da !important;
    }
    .markdown-body code {
      color: #0550ae;
      background: #f6f8fa;
    }
    .markdown-body pre {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }
    .markdown-body img {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      margin: 1.2rem auto;
      border-radius: 6px;
      cursor: zoom-in;
    }
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      background: rgba(15, 23, 42, 0.92);
      overflow: auto;
      text-align: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: block; }
    #lightbox img {
      display: block;
      margin: auto;
      position: absolute;
      inset: 0;
      max-width: 94vw;
      max-height: 94vh;
      background: #fff;
      border-radius: 8px;
      padding: 14px;
      box-sizing: border-box;
      cursor: zoom-in;
    }
    #lightbox.zoomed { cursor: zoom-out; }
    #lightbox.zoomed img {
      position: static;
      margin: 3vh auto;
      max-width: none;
      max-height: none;
      width: 170vw;
      cursor: zoom-out;
    }
    #lightbox .lb-hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: #e2e8f0;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 999px;
      padding: 6px 14px;
      pointer-events: none;
    }
    #status {
      margin-left: auto;
      font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #57606a;
    }
    @media (max-width: 767px) {
      .markdown-body {
        margin: 0;
        border-radius: 0;
        border-left: none;
        border-right: none;
        padding: 22px 16px 30px;
        font-size: 16px;
      }
    }
    .markdown-body table th, .markdown-body table td { background: #ffffff !important; }
    .markdown-body table tr:nth-child(2n) td { background: #f6f8fa !important; }
    .markdown-body table th { background: #f6f8fa !important; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../">DAVINCI v2 spec</a>
    <a href="spec.md" download>Download spec.md</a>
    <a href="spec.md" target="_blank" rel="noopener noreferrer">Raw markdown</a>
    <button id="toc-toggle" type="button" aria-expanded="false" aria-controls="toc" disabled>Table of contents</button>
    <span id="status">Loading…</span>
    <nav id="toc" aria-label="Table of contents" hidden>
      <ol id="toc-list"></ol>
    </nav>
  </div>
  <article id="content" class="markdown-body"></article>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <img id="lightbox-img" src="" alt="">
    <div class="lb-hint">click image to zoom · click outside or press Esc to close</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.min.js" integrity="sha384-zCewoQXXb5Xf+2nvCjab0EbMl7FWVpJMsKyrc8M8DqxjFra4DY4XHwheVdHXa34k" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js" integrity="sha384-XQqX/4yiUGu+oyr87jvWzRuqBUK/adrY0DunhL+tID9m/9dwSpV8h9Fk/Sg6ifVQ" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const content = document.getElementById('content');
      try {
        const response = await fetch('spec.md', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const md = await response.text();
        marked.setOptions({ gfm: true, breaks: false });
        const math = [];
        const protectedMd = md.replace(/\$\$[\s\S]+?\$\$|\$[^\n$]+?\$/g, (m) => {
          math.push(m);
          return '@@MATH' + (math.length - 1) + '@@';
        });
        let html = DOMPurify.sanitize(marked.parse(protectedMd));
        html = html.replace(/@@MATH(\d+)@@/g, (_, i) =>
          math[+i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
        content.innerHTML = html;
        const tocToggle = document.getElementById('toc-toggle');
        const toc = document.getElementById('toc');
        const tocList = document.getElementById('toc-list');
        const usedIds = new Set(Array.from(document.querySelectorAll('[id]'), el => el.id));
        // Build navigation from rendered headings, keeping duplicate titles distinct.
        content.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
          const title = heading.textContent.trim();
          if (!heading.id) {
            const base = title.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s+/g, '-') || 'section';
            let id = base;
            let suffix = 1;
            while (usedIds.has(id)) id = base + '-' + suffix++;
            heading.id = id;
            usedIds.add(id);
          }
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = '#' + encodeURIComponent(heading.id);
          link.textContent = title;
          link.style.setProperty('--toc-depth', Number(heading.tagName.slice(1)) - 1);
          item.append(link);
          tocList.append(item);
        });
        const closeToc = () => {
          toc.hidden = true;
          tocToggle.setAttribute('aria-expanded', 'false');
        };
        tocToggle.disabled = !tocList.children.length;
        tocToggle.addEventListener('click', () => {
          toc.hidden = !toc.hidden;
          tocToggle.setAttribute('aria-expanded', String(!toc.hidden));
        });
        toc.addEventListener('click', (event) => {
          const link = event.target.closest('a');
          if (!link) return;
          closeToc();
          const heading = document.getElementById(decodeURIComponent(link.hash.slice(1)));
          heading.setAttribute('tabindex', '-1');
          heading.focus({ preventScroll: true });
        });
        document.addEventListener('click', (event) => {
          if (!toc.contains(event.target) && !tocToggle.contains(event.target)) closeToc();
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !toc.hidden) {
            closeToc();
            tocToggle.focus();
          }
        });
        const topbar = document.querySelector('.topbar');
        new ResizeObserver(() => {
          document.documentElement.style.setProperty('--topbar-height', topbar.offsetHeight + 'px');
        }).observe(topbar);
        if (window.renderMathInElement) {
          window.renderMathInElement(content, {
            throwOnError: false,
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ]
          });
        }
        status.textContent = 'DAVINCI v3-PQ · draft';

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = () => {
          lightbox.classList.remove('open', 'zoomed');
          lightboxImg.src = '';
          document.body.style.overflow = '';
        };
        content.addEventListener('click', (e) => {
          const img = e.target.closest('img');
          if (!img) return;
          lightboxImg.src = img.src;
          lightboxImg.alt = img.alt || '';
          lightbox.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
        lightbox.addEventListener('click', (e) => {
          if (e.target === lightboxImg) {
            lightbox.classList.toggle('zoomed');
            if (!lightbox.classList.contains('zoomed')) lightbox.scrollTo(0, 0);
          } else {
            closeLightbox();
          }
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
        });
      } catch (err) {
        status.textContent = 'Failed to load spec';
        content.innerHTML = '<p>Unable to render <code>spec.md</code>: ' + err.message + '</p>';
      }
    })();
  </script>
</body>
</html>
