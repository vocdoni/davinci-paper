<!DOCTYPE html>
<html lang="en" data-color-mode="light" data-light-theme="light" data-dark-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <title>DAVINCI v3-PQ — Post-Quantum Protocol Specification</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css" integrity="sha384-y0W3M22ACdv+yTWx1gSgw8yRa++DRY7bp/LjeFT6Wz8Sawsr//4qb5BDQxsq+xJx" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <style>
    :root {
      color-scheme: light;
      --fgColor-default: #1f2328;
      --fgColor-muted: #57606a;
      --fgColor-accent: #0969da;
      --bgColor-default: #ffffff;
      --bgColor-muted: #f6f8fa;
      --borderColor-default: #d0d7de;
    }
    body {
      margin: 0;
      background: linear-gradient(180deg, #eef2f7 0%, #f6f8fa 30%, #f6f8fa 100%);
      color: #1f2328;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #d0d7de;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
    }
    .topbar a {
      text-decoration: none;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 6px 10px;
      color: #1f2328;
      background: #f6f8fa;
      font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 14px auto 24px;
      padding: 30px 28px 40px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(31, 35, 40, 0.07);
      color: #1f2328 !important;
      font-size: 17px;
      line-height: 1.72;
    }
    .markdown-body p,
    .markdown-body li,
    .markdown-body blockquote,
    .markdown-body td,
    .markdown-body th {
      color: #1f2328 !important;
    }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      color: #0f172a !important;
      letter-spacing: -0.01em;
    }
    .markdown-body a {
      color: #0969da !important;
    }
    .markdown-body code {
      color: #0550ae;
      background: #f6f8fa;
    }
    .markdown-body pre {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }
    .markdown-body img {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      margin: 1.2rem auto;
      border-radius: 6px;
    }
    #status {
      margin-left: auto;
      font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #57606a;
    }
    @media (max-width: 767px) {
      .markdown-body {
        margin: 0;
        border-radius: 0;
        border-left: none;
        border-right: none;
        padding: 22px 16px 30px;
        font-size: 16px;
      }
    }
    .markdown-body table th, .markdown-body table td { background: #ffffff !important; }
    .markdown-body table tr:nth-child(2n) td { background: #f6f8fa !important; }
    .markdown-body table th { background: #f6f8fa !important; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../">DAVINCI v2 spec</a>
    <a href="spec.md" download>Download spec.md</a>
    <a href="spec.md" target="_blank" rel="noopener noreferrer">Raw markdown</a>
    <span id="status">Loading…</span>
  </div>
  <article id="content" class="markdown-body"></article>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.min.js" integrity="sha384-zCewoQXXb5Xf+2nvCjab0EbMl7FWVpJMsKyrc8M8DqxjFra4DY4XHwheVdHXa34k" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js" integrity="sha384-XQqX/4yiUGu+oyr87jvWzRuqBUK/adrY0DunhL+tID9m/9dwSpV8h9Fk/Sg6ifVQ" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const content = document.getElementById('content');
      try {
        const response = await fetch('spec.md', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const md = await response.text();
        marked.setOptions({ gfm: true, breaks: false });
        const math = [];
        const protectedMd = md.replace(/\$\$[\s\S]+?\$\$|\$[^\n$]+?\$/g, (m) => {
          math.push(m);
          return '@@MATH' + (math.length - 1) + '@@';
        });
        let html = DOMPurify.sanitize(marked.parse(protectedMd));
        html = html.replace(/@@MATH(\d+)@@/g, (_, i) =>
          math[+i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
        content.innerHTML = html;
        if (window.renderMathInElement) {
          window.renderMathInElement(content, {
            throwOnError: false,
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ]
          });
        }
        status.textContent = 'DAVINCI v3-PQ · draft';
      } catch (err) {
        status.textContent = 'Failed to load spec';
        content.innerHTML = '<p>Unable to render <code>spec.md</code>: ' + err.message + '</p>';
      }
    })();
  </script>
</body>
</html>
